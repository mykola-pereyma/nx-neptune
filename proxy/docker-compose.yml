services:
  proxy:
    build:
      context: ..
      dockerfile: proxy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-}
      # Single source of truth for browser origins: drives CORS, the
      # server-side Origin check, and the trusted Host hostnames. Loopback
      # is always allowed; these entries cover the Graph Explorer sidecar.
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,https://localhost:${GRAPH_EXPLORER_PORT:-8443}
      - LOG_LEVEL=info
      # Pass-through from the host env. If unset, the library applies its secure
      # defaults (private graph + deletion protection). `make up` sets both.
      - NETWORKX_PUBLIC_CONNECTIVITY
      - NETWORKX_DELETION_PROTECTION
      # Optional: Athena workgroup for projection queries (the infra stack's
      # AthenaWorkGroupName output). Unset uses the account's primary workgroup.
      - NETWORKX_ATHENA_WORKGROUP
    volumes:
      # Projects and projections survive container recreation. A named volume
      # over the image's home directory inherits appuser's ownership.
      - proxy-home:/home/appuser
    healthcheck:
      # The slim image has no wget or curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  graph-explorer:
    image: ${GRAPH_EXPLORER_IMAGE:-public.ecr.aws/neptune/graph-explorer:latest}
    platform: linux/amd64  # the image is published for amd64 only
    ports:
      # Unprivileged host port: 443/80 fail to bind under rootless runtimes.
      - "127.0.0.1:${GRAPH_EXPLORER_PORT:-8443}:443"
    environment:
      - HOST=localhost
      - AWS_REGION=${AWS_DEFAULT_REGION:-}
      - IAM=true
      - SERVICE_TYPE=neptune-graph
      - PROXY_SERVER_HTTPS_CONNECTION=true
      - PROXY_SERVER_HTTPS_PORT=443
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
    security_opt: ["no-new-privileges:true"]

volumes:
  proxy-home:
